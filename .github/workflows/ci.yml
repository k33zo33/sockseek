name: .NET CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - master
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**/packages.lock.json'
      - '.editorconfig'
      - '**/global.json'
      - '**/nuget.config'
      - 'scripts/**.ps1'
      - 'docs/soulseek-public-beta-compliance-checklist.md'
      - 'docs/soulseek-compliance-audit.md'
      - 'docs/beta-go-no-go.md'
      - 'docs/beta-limitations.md'
      - 'docs/adr/0009-closed-beta-until-soulseek-compliance.md'
      - '.github/workflows/**.yml'

  push:
    branches:
      - master
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**/packages.lock.json'
      - '.editorconfig'
      - '**/global.json'
      - '**/nuget.config'
      - 'scripts/**.ps1'
      - 'docs/soulseek-public-beta-compliance-checklist.md'
      - 'docs/soulseek-compliance-audit.md'
      - 'docs/beta-go-no-go.md'
      - 'docs/beta-limitations.md'
      - 'docs/adr/0009-closed-beta-until-soulseek-compliance.md'
      - '.github/workflows/**.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        # The cache key invalidates when the lock file changes
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --no-restore --configuration Release

    - name: Install LibVLC test runtime
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --yes libvlc-dev vlc

    - name: Test Project
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Validate release evidence helpers
      shell: pwsh
      run: |
        ./scripts/test_soulseek_live_checklist.ps1
        ./scripts/validate_soulseek_compliance_gate.ps1
        ./scripts/test_soulseek_compliance_gate_validator.ps1
        ./scripts/validate_beta_go_no_go.ps1
        ./scripts/test_beta_go_no_go_validator.ps1
        ./scripts/test_windows_package_smoke_evidence_validator.ps1

  format-check:
    if: false  # disabled: dotnet format has platform-sensitive indentation behavior
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Format code
      run: dotnet format --verify-no-changes
